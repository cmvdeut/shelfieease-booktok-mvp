# HARD OFF sinds 2026-07-30 — @shelfieease distributie-kill (TikTok/IG ~0 bereik).
# Geen Blotato/API-autopublish tot recovery via native app-posts. Job is geblokkeerd
# met `if: false` (cron blijft in bestand maar runt niet). Heractiveren = if verwijderen
# én DISABLED_PLATFORMS in scripts/publish-scheduled-blotato.ts leegmaken.

name: Publish Scheduled Social Media Posts

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: publish-scheduled
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Publish due posts via Blotato
        env:
          BLOTATO_API_KEY: ${{ secrets.BLOTATO_API_KEY }}
          BLOTATO_TIKTOK_USERNAME: ${{ secrets.BLOTATO_TIKTOK_USERNAME }}
          BLOTATO_INSTAGRAM_USERNAME: ${{ secrets.BLOTATO_INSTAGRAM_USERNAME }}
        run: npx tsx scripts/publish-scheduled-blotato.ts

      - name: Commit updated schedule + log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scheduled-posts.json social-posts-log.md
          git diff --cached --quiet || git commit -m "Auto-publish scheduled posts via Blotato [skip ci]"
          git push
